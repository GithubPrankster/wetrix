name: Wetrix (North America)
sha1: 6e40312cf88a9182e93b396b9d82457b1aba7cd6
options:
  basename: wetrix
  target_path: baserom.z64
  elf_path: build/wetrix.elf
  base_path: .
  platform: n64
  compiler: KMC

  # asm_path: asm
  # src_path: src
  # build_path: build
  # create_asm_dependencies: True

  ld_script_path: build/wetrix.ld
  ld_dependencies: True

  find_file_boundaries: True
  header_encoding: ASCII

  o_as_suffix: True
  use_legacy_include_asm: False
  mips_abi_float_regs: o32

  # section_order: [".text", ".data", ".rodata", ".bss"]
  # auto_link_sections: [".data", ".rodata", ".bss"]

  symbol_addrs_path:
    - config/us/symbol_addrs.txt
    - config/us/symbol_addrs_libultra.txt
  reloc_addrs_path:
    - reloc_addrs.txt

  # undefined_funcs_auto_path: undefined_funcs_auto.txt
  # undefined_syms_auto_path: undefined_syms_auto.txt

  extensions_path: tools/splat_ext

  # string_encoding: ASCII
  # data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2
  # libultra_symbols: True
  # hardware_regs: True
  # gfx_ucode: # one of [f3d, f3db, f3dex, f3dexb, f3dex2]
segments:
  - name: header
    type: header
    start: 0x0

  - name: ipl3
    type: bin
    start: 0x40

  - name: entry # This game uses a non-traditional entrypoint, meaning splat's analysis may be wrong
    type: code
    start: 0x1000
    vram: 0x80000400
    subsegments:
      - [0x1000, hasm]

  - name: main
    type: code
    start: 0x1040
    vram: 0x80000440
    follows_vram: entry
    subsegments:
      - [0x1040, rodata]
      - [0x1130, rodata]
      - [0x1160, rodata, 10DC0]
      - [0x1580, rodata]
      - [0xBCB0, rodata]
      - [0xE450, rodata]
      - [0xE560, rodata]
      - [0xE820, rodata]
      - [0xE880, rodata]
      - [0xE9C0, rodata]
      - [0xEA20, data]
      - [0x10DC0, asm] # first real instruction 800101C0
      - [0x50110, asm]
      - [0x50370, asm]
      - [0x506F0, asm]
      - [0x507A0, asm]
      - [0x507B0, asm]
